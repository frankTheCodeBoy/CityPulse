services:
  - type: web
    name: citypulse-backend
    env: docker
    plan: free
    healthCheckPath: /cities
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: citypulse-db
          property: connectionString
    autoDeploy: false

databases:
  - name: citypulse-db
    databaseName: citypulse
    user: citypulse_user
    plan: free
